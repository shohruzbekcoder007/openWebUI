# Production-ready Nginx for Open WebUI + Hermes Gateway
# Supports HTTPS, WebSockets, SSE streaming, large uploads

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Large uploads (RAG files, attachments)
    client_max_body_size 100m;
    client_body_buffer_size 1m;

    # Gzip (do not gzip SSE / event-stream)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_disable "msie6";

    # Upstream definitions (Docker DNS)
    upstream open_webui {
        server open-webui:8080;
        keepalive 32;
    }

    upstream gateway {
        server gateway:8000;
        keepalive 16;
    }

    # Shared proxy defaults
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
