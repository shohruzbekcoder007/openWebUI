# -----------------------------------------------------------------------------
# HTTP — redirect to HTTPS when SSL is enabled; otherwise serve directly
# Local/prod without certs: serve on :80
# Production with certs: set NGINX_SSL_ENABLED=true and mount certs
# -----------------------------------------------------------------------------

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=webui_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Let's Encrypt (optional)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health for load balancers
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Direct gateway API (optional external access)
    location /api/gateway/ {
        limit_req zone=api_limit burst=40 nodelay;

        rewrite ^/api/gateway/(.*)$ /$1 break;

        proxy_pass http://gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Streaming / SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Open WebUI (primary UI)
    location / {
        limit_req zone=webui_limit burst=60 nodelay;

        proxy_pass http://open_webui;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket + long-lived streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        client_max_body_size 100m;
    }
}

# -----------------------------------------------------------------------------
# HTTPS server — enable by mounting certs and uncommenting / using ssl.conf
# See nginx/conf.d/ssl.conf.example
# -----------------------------------------------------------------------------
