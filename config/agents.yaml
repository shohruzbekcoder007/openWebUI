# =============================================================================
# Hermes Agents Configuration
# Each agent appears as a model in Open WebUI via GET /v1/models
# Gateway routes POST /v1/chat/completions to the matching agent by model id/name.
#
# Reload: restart the gateway service after editing this file
#   docker compose restart gateway
# =============================================================================

agents:
  - id: agriculture
    name: Qishloq xo'jaligi
    description: "QXAudit host (docs RAG) — message API with session_id from Open WebUI."
    avatar: "🌾"
    system_prompt: |
      You are QXAudit (routed as Qishloq xo'jaligi in Open WebUI).
      Answer document/policy questions via the upstream QXAudit service.
    # Points at QXAudit on host :9090 by default (override HERMES_AGRICULTURE_BASE_URL).
    # Use message API so Gateway forwards session_id / chat_id for multi-turn memory.
    base_url: "${HERMES_AGRICULTURE_BASE_URL:-http://host.docker.internal:9090}"
    endpoint: "/v1/chat"
    api_style: message
    headers: {}
    api_key: "${HERMES_AGRICULTURE_API_KEY:-}"
    model: "${HERMES_AGRICULTURE_MODEL:-agriculture-default}"
    enabled: true
    timeout: 120
    stream: true
    temperature: 0.3

  - id: gis
    name: GIS
    description: "HR / GIS agent (host hr-ai-agent via /v1/chat message API)."
    avatar: "🗺️"
    system_prompt: |
      You are GIS Hermes, a geospatial information systems specialist.
      You assist with coordinate systems, projections, spatial analysis,
      map layers, geoprocessing concepts, and GIS best practices.
    # Host agent on the PC: use host.docker.internal (not localhost) from Gateway.
    base_url: "${HERMES_GIS_BASE_URL:-http://host.docker.internal:8080}"
    endpoint: "/v1/chat"
    # hr-ai-agent expects {"message":"...","session_id":"..."} not OpenAI chat.completions
    # session_id is filled from Open WebUI session_id / metadata / chat_id
    api_style: message
    headers: {}
    api_key: "${HERMES_GIS_API_KEY:-}"
    model: "${HERMES_GIS_MODEL:-gis-default}"
    enabled: true
    timeout: 120
    stream: true
    temperature: 0.4

  - id: statistics
    name: Statistics
    description: "Statistical methods, hypothesis testing, and data interpretation."
    avatar: "📊"
    system_prompt: |
      You are Statistics Hermes, a statistical analysis expert.
      You help with descriptive statistics, inference, probability,
      experimental design, and clear interpretation of results.
    # Host hermes agent (e.g. hermes_security_agent on :9000) uses message API, not OpenAI completions.
    base_url: "${HERMES_STATISTICS_BASE_URL:-http://mock-agent:9010}"
    endpoint: "/v1/chat"
    # hermes agent expects {"message":"...","session_id":"..."} not OpenAI chat.completions
    api_style: message
    headers: {}
    api_key: "${HERMES_STATISTICS_API_KEY:-}"
    model: "${HERMES_STATISTICS_MODEL:-statistics-default}"
    enabled: true
    timeout: 120
    stream: true
    temperature: 0.3

  - id: press_reliz
    name: Press reliz
    description: "Press reliz assistant: drafting, editing, and distributing press releases."
    avatar: "📰"
    system_prompt: |
      You are Press reliz Hermes, a press release assistant.
      You draft and edit press releases with a clear headline, lead paragraph,
      key facts, quotes, and boilerplate, and you keep the tone factual and
      newsroom-ready.
    base_url: "${HERMES_PRESS_RELIZ_BASE_URL:-http://mock-agent:9010}"
    endpoint: "/v1/chat"
    # PressRelizAgent expects {"message":"...","session_id":"..."} not OpenAI chat.completions
    api_style: message
    # /v1/chat also takes multipart: message= + session_id= + file=
    # Gateway downloads the raw bytes from Open WebUI and posts them as form parts,
    # so the agent's own pdf_extract / pdf_to_md tools see the original file.
    files_style: multipart
    headers: {}
    api_key: "${HERMES_PRESS_RELIZ_API_KEY:-}"
    model: "${HERMES_PRESS_RELIZ_MODEL:-press-reliz-default}"
    enabled: true
    # A multi-page PDF goes through pdf_extract and a 27B model before a single
    # token comes back, which runs well past the 120s the other agents use.
    timeout: "${HERMES_PRESS_RELIZ_TIMEOUT:-900}"
    stream: true
    temperature: 0.2

  - id: programmer
    name: Programmer
    description: "Software engineering, architecture, debugging, and code review."
    avatar: "💻"
    system_prompt: |
      You are Programmer Hermes, a senior software engineer.
      You write clean, production-quality code, explain design trade-offs,
      review implementations, and prefer secure, maintainable solutions.
    base_url: "${HERMES_PROGRAMMER_BASE_URL:-http://mock-agent:9010}"
    endpoint: "/v1/chat/completions"
    headers: {}
    api_key: "${HERMES_PROGRAMMER_API_KEY:-}"
    model: "${HERMES_PROGRAMMER_MODEL:-programmer-default}"
    enabled: true
    timeout: 180
    stream: true
    temperature: 0.4

  - id: translator
    name: Translator
    description: "Professional translation and localization across languages."
    avatar: "🌐"
    system_prompt: |
      You are Translator Hermes, a professional translator.
      You provide accurate, natural translations, preserve meaning and tone,
      and call out idioms or cultural nuances when relevant.
    base_url: "${HERMES_TRANSLATOR_BASE_URL:-http://mock-agent:9010}"
    endpoint: "/v1/chat/completions"
    headers: {}
    api_key: "${HERMES_TRANSLATOR_API_KEY:-}"
    model: "${HERMES_TRANSLATOR_MODEL:-translator-default}"
    enabled: true
    timeout: 90
    stream: true
    temperature: 0.3

# Optional global defaults applied when a field is omitted on an agent
defaults:
  timeout: 120
  stream: true
  temperature: 0.5
  endpoint: "/v1/chat/completions"
